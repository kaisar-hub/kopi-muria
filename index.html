<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kopi Muria by Lunar Trail</title>
<style>
  :root { --bg: #1a1207; --surface: #2a1f10; --accent: #c8956c; --text: #f0e6d6; --muted: #a89279; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }

  header { background: linear-gradient(135deg, #2a1f10 0%, #3d2b15 100%); padding: 24px 16px; text-align: center; border-bottom: 2px solid var(--accent); }
  header h1 { font-size: 1.5rem; letter-spacing: 0.05em; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  main { max-width: 520px; margin: 0 auto; padding: 16px; }

  .section-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 16px 0 8px; }
  .cards { display: flex; gap: 10px; }
  .card { flex: 1; background: var(--surface); border: 2px solid transparent; border-radius: 12px; padding: 14px; cursor: pointer; transition: border-color .2s, transform .15s; text-align: center; }
  .card:hover { transform: translateY(-2px); }
  .card.aktif { border-color: var(--accent); }
  .card .nama { font-weight: 700; font-size: 1rem; }
  .card .desk { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
  .card .harga-info { font-size: 0.8rem; color: var(--accent); margin-top: 6px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--surface); border: 1.5px solid #444; border-radius: 20px; padding: 8px 16px; font-size: 0.85rem; color: var(--text); cursor: pointer; transition: all .2s; }
  .chip:hover { border-color: var(--accent); }
  .chip.aktif { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }

  #ringkasan { background: var(--surface); border-radius: 12px; padding: 16px; margin-top: 20px; display: none; }
  #ringkasan h2 { font-size: 1rem; margin-bottom: 10px; }
  .total { font-size: 1.3rem; font-weight: 700; color: var(--accent); margin: 10px 0; }

  #keranjang { background: var(--surface); border-radius: 12px; padding: 16px; margin-top: 14px; }
  #keranjang h2 { font-size: 1rem; margin-bottom: 10px; }
  .kosong { color: var(--muted); text-align: center; padding: 12px; }
  .baris-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #333; }
  .baris-item:last-child { border: none; }
  .baris-item .hapus { color: #e74c3c; cursor: pointer; font-size: 0.85rem; }
  .keranjang-total { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-top: 10px; }

  input { width: 100%; padding: 10px; margin: 4px 0 8px; border: 1px solid #444; border-radius: 8px; background: var(--bg); color: var(--text); font-size: 0.9rem; }
  input::placeholder { color: var(--muted); }

  .btn { display: block; width: 100%; background: var(--accent); color: var(--bg); border: 0; border-radius: 10px; padding: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; transition: opacity .2s; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn-tambah { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); margin-top: 12px; }
  .btn-tambah:hover { background: rgba(200,149,108,0.15); }

  .qty-control { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .qty-btn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-btn:hover { background: rgba(200,149,108,0.15); }
  .qty-val { font-size: 1.1rem; font-weight: 600; min-width: 24px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1><span>☕</span> Kopi Muria</h1>
  <p>by Lunar Trail</p>
</header>
<main>
  <div class="section-label">Pilih Kopi</div>
  <div class="cards" id="daftar-kopi"></div>

  <div class="section-label">Jenis Gilingan</div>
  <div class="chips" id="daftar-jenis"></div>

  <div class="section-label">Varian Berat</div>
  <div class="chips" id="daftar-varian"></div>

  <div id="ringkasan">
    <h2>Ringkasan</h2>
    <div id="detail-ringkasan"></div>
    <div class="total" id="harga-satuan"></div>
    <div class="qty-control">
      <button class="qty-btn" id="qty-minus">−</button>
      <span class="qty-val" id="qty-val">1</span>
      <button class="qty-btn" id="qty-plus">+</button>
    </div>
    <button class="btn btn-tambah" id="btn-tambah">+ Tambah ke Keranjang</button>
  </div>

  <div id="keranjang">
    <h2>🛒 Keranjang</h2>
    <div id="isi-keranjang"><div class="kosong">Belum ada pesanan</div></div>
    <div class="keranjang-total">Total: <span id="grand-total">Rp0</span></div>
    <label>Nama pemesan</label>
    <input id="nama" placeholder="Nama kamu">
    <label>Catatan (opsional)</label>
    <input id="catatan" placeholder="contoh: minta extra seal">
    <button class="btn" id="lanjut" disabled>Pesan via WhatsApp</button>
  </div>
</main>
<script src="menu.js"></script>
<script src="app.js"></script>
</body>
</html>
